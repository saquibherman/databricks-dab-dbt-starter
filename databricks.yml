# This is a Declarative Automation Bundle definition for dab_dbt_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
#
# No workspace-specific values are stored in this file:
# - Workspace host: from your Databricks CLI profile (`-p <PROFILE>`) locally, or DATABRICKS_HOST in CI/CD.
# - Service principal (test/prod): variable `service_principal_id` (its application ID), set in CI/CD from
#   the AZURE_CLIENT_ID secret; locally with `--var service_principal_id=<app-id>`.
# - SQL warehouse: looked up by name (`warehouse_name`) at deploy time.
bundle:
  name: dab_dbt_project
  uuid: 6c804e9f-cd6b-42b8-ab68-e71d4e5edfab

include:
  - resources/*.yml

# Build the dab_project wheel (src/dab_project) on every deploy and upload it with the bundle.
artifacts:
  dab_project_whl:
    type: whl
    build: uv build --wheel
    path: .

variables:
  catalog:
    description: Unity Catalog catalog for bronze/silver/gold
    default: citibike_dev
  dev_flag:
    default: true
  warehouse_name:
    description: Name of the SQL warehouse dbt runs on (resolved to its ID per workspace)
    default: Serverless Starter Warehouse
  warehouse_id:
    description: SQL warehouse ID used by dbt (looked up from warehouse_name)
    lookup:
      warehouse: ${var.warehouse_name}
  service_principal_id:
    description: Application (client) ID of the service principal that owns and runs test/prod deployments
    default: ""

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      artifacts_dynamic_version: true

  test:
    mode: production
    presets:
      name_prefix: "[testing] "
    workspace:
      # Private to the deploying identity (the service principal), not writable by all users.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: citibike_test
      dev_flag: false
    permissions:
      - service_principal_name: ${var.service_principal_id}
        level: CAN_MANAGE
    run_as:
      service_principal_name: ${var.service_principal_id}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: citibike_prod
      dev_flag: false
    permissions:
      - service_principal_name: ${var.service_principal_id}
        level: CAN_MANAGE
    run_as:
      service_principal_name: ${var.service_principal_id}
